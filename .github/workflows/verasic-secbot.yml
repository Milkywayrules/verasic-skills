name: verasic-secbot

on:
  push:
    paths:
      - 'skills/verasic-secbot/**'
      - 'cursor/agents/verasic-secbot-reviewer.md'
      - '.github/workflows/verasic-secbot.yml'
  pull_request:
    paths:
      - 'skills/verasic-secbot/**'
      - 'cursor/agents/verasic-secbot-reviewer.md'
      - '.github/workflows/verasic-secbot.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secbot regression
        run: bash skills/verasic-secbot/scripts/test-regression.sh
